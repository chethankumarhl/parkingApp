<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japanese Plate OCR</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2026; --muted:#6b7280; --accent:#2563eb; --border:#e2e5ea; --ok:#16a34a; --warn:#d97706; --err:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1a1f26; --text:#e8eaed; --muted:#9aa3ae; --accent:#4b8bff; --border:#2b323b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Noto Sans JP", sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.3rem; margin: 0 0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button { flex:1; padding:10px; border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:8px; font-size:1rem; cursor:pointer; }
  .tabs button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .hidden { display:none !important; }
  .drop { border:2px dashed var(--border); border-radius:10px; padding:28px 12px; text-align:center; color:var(--muted); cursor:pointer; }
  .drop.over { border-color:var(--accent); color:var(--accent); }
  video, .preview { width:100%; border-radius:10px; background:#000; max-height:360px; object-fit:contain; display:block; }
  .btn { width:100%; margin-top:12px; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .plate { font-size:2rem; font-weight:700; text-align:center; letter-spacing:.05em; padding:12px 0; }
  .grid { display:grid; grid-template-columns: repeat(4,1fr); gap:8px; text-align:center; }
  .grid div { background:var(--bg); border-radius:8px; padding:8px 4px; }
  .grid small { display:block; color:var(--muted); font-size:.7rem; }
  .grid b { font-size:1.2rem; }
  .badge { display:inline-block; padding:3px 10px; border-radius:99px; font-size:.8rem; color:#fff; }
  .msg { color:var(--muted); text-align:center; }
  .err { color:var(--err); }
  ul { padding-left:18px; margin:8px 0 0; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>🚗 Japanese Plate OCR</h1>

  <div class="tabs">
    <button id="tabUpload" class="active">📁 Upload photo</button>
    <button id="tabCamera">📷 Live camera</button>
  </div>

  <!-- Upload -->
  <section id="paneUpload" class="card">
    <label class="drop" id="drop">
      Tap to choose a photo, or drop one here
      <input id="file" type="file" accept="image/*" hidden>
    </label>
    <img id="preview" class="preview hidden" alt="Preview">
    <button id="btnScanFile" class="btn hidden">Read plate</button>
  </section>

  <!-- Camera -->
  <section id="paneCamera" class="card hidden">
    <video id="video" autoplay playsinline muted></video>
    <p class="msg" style="font-size:.85rem">Fill the frame with the plate and hold steady.</p>
    <button id="btnCapture" class="btn">Capture &amp; read plate</button>
  </section>

  <!-- Result -->
  <section id="result" class="card hidden"></section>
  <canvas id="canvas" class="hidden"></canvas>
</main>

<script>
const API = "";  // same origin. Set e.g. "http://localhost:8000" if you host the page elsewhere.
const $ = id => document.getElementById(id);
let stream = null, chosenFile = null;

// ---------- Tabs ----------
function showTab(name) {
  const cam = name === "camera";
  $("tabCamera").classList.toggle("active", cam);
  $("tabUpload").classList.toggle("active", !cam);
  $("paneCamera").classList.toggle("hidden", !cam);
  $("paneUpload").classList.toggle("hidden", cam);
  $("result").classList.add("hidden");
  cam ? startCamera() : stopCamera();
}
$("tabUpload").onclick = () => showTab("upload");
$("tabCamera").onclick = () => showTab("camera");

// ---------- Camera ----------
async function startCamera() {
  if (stream) return;
  if (!navigator.mediaDevices?.getUserMedia) {
    return showError("Camera needs HTTPS (or localhost). Use the Upload tab instead.");
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    $("video").srcObject = stream;
  } catch (e) {
    showError("Could not open camera: " + e.message);
  }
}
function stopCamera() {
  stream?.getTracks().forEach(t => t.stop());
  stream = null;
  $("video").srcObject = null;
}
$("btnCapture").onclick = () => {
  const v = $("video");
  if (!v.videoWidth) return showError("Camera not ready yet.");
  const c = $("canvas");
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  c.toBlob(blob => scan(blob, $("btnCapture")), "image/jpeg", 0.92);
};

// ---------- Upload ----------
function setFile(f) {
  if (!f || !f.type.startsWith("image/")) return showError("Please choose an image file.");
  chosenFile = f;
  $("preview").src = URL.createObjectURL(f);
  $("preview").classList.remove("hidden");
  $("btnScanFile").classList.remove("hidden");
  $("result").classList.add("hidden");
}
$("file").onchange = e => setFile(e.target.files[0]);
$("btnScanFile").onclick = () => scan(chosenFile, $("btnScanFile"));
const drop = $("drop");
["dragover","dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => setFile(e.dataTransfer.files[0]));

// ---------- API call ----------
async function scan(blob, btn) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Reading…";
  try {
    const form = new FormData();
    form.append("file", blob, "plate.jpg");
    const res = await fetch(API + "/ocr?debug=true", { method: "POST", body: form });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    showResult(await res.json());
  } catch (e) {
    showError("Request failed: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

// ---------- Rendering ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function showResult(r) {
  const el = $("result");
  el.classList.remove("hidden");
  const reg = r.registration_number;
  const took = r.debug?.time_ms ? `<li><b>Time:</b> ${r.debug.time_ms} ms</li>` : "";
  const passes = took + Object.entries(r.debug?.passes || {}).map(([k, v]) => `<li><b>Pass ${k}:</b> ${esc(v ?? "-")}</li>`).join("");
  const raw = passes + (r.debug?.detected_text || []).map(t => `<li>${esc(t)}</li>`).join("");
  if (!reg) {
    el.innerHTML = '<p class="msg err">No licence plate found. Try a closer, sharper photo with the plate filling more of the frame.</p>'
      + (raw ? `<details><summary class="msg">Raw text seen</summary><ul>${raw}</ul></details>` : "");
    return;
  }
  el.innerHTML = `<div class="msg" style="font-size:.8rem">registration_number</div>
    <div class="plate">${esc(reg)}</div>
    <button class="btn secondary" id="copyBtn">Copy</button>
    ${raw ? `<details style="margin-top:12px"><summary class="msg">Raw text seen</summary><ul>${raw}</ul></details>` : ""}`;
  $("copyBtn").onclick = () => navigator.clipboard.writeText(reg);
}
function showError(msg) {
  const el = $("result");
  el.classList.remove("hidden");
  el.innerHTML = `<p class="msg err">${esc(msg)}</p>`;
}
</script>
</body>
</html>
